# Deploys main to Cloud Run through the existing cloudbuild.yaml pipeline
# (image build, migration job, then the service rollout).
#
# Authentication is keyless: GitHub issues an OIDC token for this workflow run
# and Google Cloud's Workload Identity Federation exchanges it for short-lived
# credentials of the neighborvote-deployer service account. The "production"
# environment only allows deployments from main. There are no long-lived cloud
# keys stored in GitHub.
#
# This replaced the Cloud Build GitHub trigger, which is kept disabled; never
# re-enable it while this workflow runs on push, or a merge deploys twice.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GCP_PROJECT: permitting-ai-helper
  GCP_REGION: us-east4
  SERVICE: neighborvote
  APP_URL: https://neighborvote.online
  WORKLOAD_IDENTITY_PROVIDER: projects/650621702399/locations/global/workloadIdentityPools/github/providers/github-oidc
  DEPLOYER_SERVICE_ACCOUNT: neighborvote-deployer@permitting-ai-helper.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: neighborvote-runtime@permitting-ai-helper.iam.gserviceaccount.com
  # Non-secret settings kept as variables on the production environment.
  CLOUDSQL_INSTANCE: ${{ vars.CLOUDSQL_INSTANCE }}
  GCS_EXPORT_BUCKET: ${{ vars.GCS_EXPORT_BUCKET }}

jobs:
  deploy:
    name: Build, migrate and deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: https://neighborvote.online
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check deploy settings
        run: |
          missing=0
          for name in CLOUDSQL_INSTANCE GCS_EXPORT_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::Set the $name variable on the production environment."
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A last gate before shipping, in case a merge bypassed the CI checks.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # _ALLOW_COMMUNITY_MIGRATION keeps its "false" default: the one-time
      # gate is for maintenance releases run by hand (see the README).
      # The staging directory is given explicitly so the deployer does not
      # need permission to list every bucket in the project.
      - name: Submit Cloud Build
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --project "$GCP_PROJECT" \
            --gcs-source-staging-dir "gs://${GCP_PROJECT}_cloudbuild/source" \
            --substitutions "_SERVICE=${SERVICE},_REGION=${GCP_REGION},_CLOUDSQL_INSTANCE=${CLOUDSQL_INSTANCE},_SERVICE_ACCOUNT=${RUNTIME_SERVICE_ACCOUNT},_GCS_EXPORT_BUCKET=${GCS_EXPORT_BUCKET}" \
            --quiet

      - name: Verify the live service
        run: |
          revision=$(gcloud run services describe "$SERVICE" \
            --region "$GCP_REGION" --project "$GCP_PROJECT" \
            --format 'value(status.latestReadyRevisionName)')
          echo "Serving revision: $revision"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$APP_URL/api/health"; then
              echo
              echo "Health check passed."
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after deploy." >&2
          exit 1
