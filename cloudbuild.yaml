substitutions:
  _SERVICE: neighborvote
  _REGION: us-east4
  _AR_REPO: cloud-run-source-deploy
  _CLOUDSQL_INSTANCE: ""
  _SERVICE_ACCOUNT: ""
  _APP_BASE_URL: ""
  _GCS_EXPORT_BUCKET: ""

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: Build image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID
      - .

  - id: Push image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID

  - id: Deploy Cloud Run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --service-account=${_SERVICE_ACCOUNT}
      - --set-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      - --set-env-vars=APP_BASE_URL=${_APP_BASE_URL},MAIL_PROVIDER=postal,GCS_EXPORT_BUCKET=${_GCS_EXPORT_BUCKET},RUN_DB_MIGRATIONS=0
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,POSTAL_API_KEY=POSTAL_API_KEY:latest,POSTAL_API_URL=POSTAL_API_URL:latest,MAIL_FROM=MAIL_FROM:latest,ADMIN_EMAILS=ADMIN_EMAILS:latest,ADMIN_SESSION_SECRET=ADMIN_SESSION_SECRET:latest,MEMBER_SESSION_SECRET=MEMBER_SESSION_SECRET:latest,CRON_JOB_TOKEN=CRON_JOB_TOKEN:latest
      - --quiet

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID
